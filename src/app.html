<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		%sveltekit.head%
        <style>
    
            :root {
                color-scheme: light dark;

                --color-bg-primary:   light-dark(#FFFFFF, #1C1E22);
                --color-bg-secondary: light-dark(#23272f, #23272f);
                --color-bg-tertiary:  light-dark(#FFFFFF, #1f2228);
                --color-fg:           light-dark(#cacbce, #cacbce);
            }

            html, body {
                height: 100%;
                background-color: var(--color-bg-primary);
            }
        </style>
	</head>
	<body data-sveltekit-preload-data="hover" style="margin: 0">
        <div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
